[package]
name = "sala-do-futuro-webapp"
version = "1.1.0"
edition = "2024"
description = "Sala do Futuro - Web application for COSMIC and Pop!_OS with integrated notifications and panel support"
authors = ["felix-the-cat177"]
license = "GPL-3.0-only"
repository = "https://github.com/felix-the-cat177/sala-do-futuro-for-pop-os-cosmic-webapp"
default-run = "sala-do-futuro-webapp"

[[bin]]
name = "sala-do-futuro-webapp"
path = "src/bin/sala-do-futuro-webapp/main.rs"

[[bin]]
name = "sala-do-futuro-webview"
path = "src/bin/webview/main.rs"

[[bin]]
name = "sala-do-futuro-webview-helper"
path = "src/bin/webview/helper.rs"

[[bin]]
name = "cosmic-panel-item"
path = "src/bin/cosmic-panel-item/main.rs"

[[bin]]
name = "sala-do-futuro-notification-daemon"
path = "src/bin/notification-daemon/main.rs"

[dependencies]
# dynamic launcher portal
ashpd = { version = "0.13", features = [
    "wayland",
    "file_chooser",
    "dynamic_launcher",
] }
# for webview
cef = { version = "145", features = ["linux-x11", "build-util"] }
x11-dl = "2.21.0"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
i18n-embed-fl = "0.10"
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
once_cell = "1.21"
image = "0.25"
open = "5.3"
rand = "0.10"
ron = "0.12"
rust-embed = "8.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = "0.28"
strum_macros = "0.28"
svg = "0.18"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "fmt",
    "env-filter",
    "json",
] }
url = "2.5"
urlencoding = "2.1"
usvg = "0.47"
walkdir = "2.5"
# D-Bus integration for notifications
zbus = { version = "4", features = ["tokio"] }
zvariant = "4"

[features]
default = ["linux-x11"]
linux-x11 = ["cef/linux-x11"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "a37be90e811f365273bf632bf7090b63a368f092"
features = ["a11y", "dbus-config", "winit", "multi-window", "wayland", "tokio", "applet", "applet-token"]

[patch."https://github.com/pop-os/cosmic-text.git"]
cosmic-text = { git = "https://www.github.com/pop-os/cosmic-text.git", rev = "29034e56b47b7e259f9a18a01fcda8ff267fc2d1" }




